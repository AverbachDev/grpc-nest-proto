syntax = "proto3";

package extrato;

service ExtratoService {

    // Casos de uso especiais da tela "Conferência de Depósitos"
    // (wfmListaConferenciaDepositos.aspx) - substituem
    // vsgaExtrato_ObterItensConferencia / vsgaUsuario_ListaCobradores.
    rpc listItensConferencia (ListCriteriaRequestItemConferencia) returns (ServiceResponseListItemConferencia) {}
    rpc listCobradores (ListCriteriaRequestCobrador) returns (ServiceResponseListCobrador) {}
    // DepositosEfetuados pertence ao microservice-pagamento (nao ao extrato) -
    // agrupar/liberar criam o registro la via GrpcPagamentoProvider e devolvem
    // so a referencia do deposito criado, nao o dado completo.
    rpc agruparDepositos (AgruparDepositosRequest) returns (ServiceResponseAgruparDepositos) {}
    rpc liberarDeposito (LiberarDepositoRequest) returns (ServiceResponseLiberarDeposito) {}
    rpc aprovarDeposito (AprovarDepositoRequest) returns (ServiceResponseItemExtrato) {}

    // Casos de uso especiais da tela "Depositos Pendentes de Aprovacao"
    // (wfmListaDepositosPendentesAprovacao.aspx) - segunda camada de
    // aprovacao, agindo sobre itens ja vinculados a um cobrador via
    // aprovarDeposito acima. Substituem vsgaExtrato_ObterItensPendentesAprovacao.
    rpc listItensPendentesAprovacao (ListCriteriaRequestItemPendenteAprovacao) returns (ServiceResponseListItemPendenteAprovacao) {}
    rpc escriturarDeposito (EscriturarDepositoRequest) returns (ServiceResponseEscriturarDeposito) {}
    rpc retornarDeposito (RetornarDepositoRequest) returns (ServiceResponseItemExtrato) {}
    rpc estornarDeposito (EstornarDepositoRequest) returns (ServiceResponseItemExtrato) {}

    // Resumo agregado da tela "Extratos - Listagem" (wfmListaExtrato.aspx /
    // wfmListaExtratoBoston.aspx, diferenciadas por cdTipoExtrato) - substitui
    // vsgaExtrato_ObterLista (soma dos itens por extrato).
    rpc listExtratoResumo (ListCriteriaRequestExtratoResumo) returns (ServiceResponseListExtratoResumo) {}

    // Cadastro manual de Extrato (porte de wfmCadExtrato.aspx /
    // wfmCadExtratoBoston.aspx - so a "feature #1": grade editavel de N
    // depositos com auto-complete, Salvar/Liberar/Adicionar Deposito. A
    // importacao automatica de arquivo de retorno/API Bradesco dessas
    // telas fica fora de escopo por enquanto - ver Etapa E).
    rpc getExtratoDetalhe (GetExtratoDetalheRequest) returns (ServiceResponseExtratoDetalhe) {}
    rpc salvarExtrato (SalvarExtratoRequest) returns (ServiceResponseSalvarExtrato) {}
    rpc obterArquivoExtrato (IdRequest) returns (ServiceResponseArquivoExtrato) {}
    rpc importarArquivoExtrato (ImportarArquivoExtratoRequest) returns (ServiceResponseImportarArquivoExtrato) {}

    rpc listExtrato (ListCriteriaRequestExtrato) returns (ServiceResponseListExtrato) {}
    rpc findOneExtrato (IdRequest) returns (ServiceResponseExtrato) {}
    rpc createExtrato (ExtratoData) returns (ServiceResponseExtrato) {}
    rpc updateExtrato (ExtratoUpdateRequest) returns (ServiceResponseExtrato) {}
    rpc removeExtrato (IdRequest) returns (ServiceResponseExtrato) {}

    rpc listItemExtrato (ListCriteriaRequestItemExtrato) returns (ServiceResponseListItemExtrato) {}
    rpc findOneItemExtrato (IdRequest) returns (ServiceResponseItemExtrato) {}
    rpc createItemExtrato (ItemExtratoData) returns (ServiceResponseItemExtrato) {}
    rpc updateItemExtrato (ItemExtratoUpdateRequest) returns (ServiceResponseItemExtrato) {}
    rpc removeItemExtrato (IdRequest) returns (ServiceResponseItemExtrato) {}

    rpc listItemExtratoParcela (ListCriteriaRequestItemExtratoParcela) returns (ServiceResponseListItemExtratoParcela) {}
    rpc findOneItemExtratoParcela (IdRequest) returns (ServiceResponseItemExtratoParcela) {}
    rpc createItemExtratoParcela (ItemExtratoParcelaData) returns (ServiceResponseItemExtratoParcela) {}
    rpc updateItemExtratoParcela (ItemExtratoParcelaUpdateRequest) returns (ServiceResponseItemExtratoParcela) {}
    rpc removeItemExtratoParcela (IdRequest) returns (ServiceResponseItemExtratoParcela) {}

    rpc listItemExtratoCobrador (ListCriteriaRequestItemExtratoCobrador) returns (ServiceResponseListItemExtratoCobrador) {}
    rpc findOneItemExtratoCobrador (IdRequest) returns (ServiceResponseItemExtratoCobrador) {}
    rpc createItemExtratoCobrador (ItemExtratoCobradorData) returns (ServiceResponseItemExtratoCobrador) {}
    rpc updateItemExtratoCobrador (ItemExtratoCobradorUpdateRequest) returns (ServiceResponseItemExtratoCobrador) {}
    rpc removeItemExtratoCobrador (IdRequest) returns (ServiceResponseItemExtratoCobrador) {}

    rpc listItemExtratoDepositante (ListCriteriaRequestItemExtratoDepositante) returns (ServiceResponseListItemExtratoDepositante) {}
    rpc findOneItemExtratoDepositante (IdRequest) returns (ServiceResponseItemExtratoDepositante) {}
    rpc createItemExtratoDepositante (ItemExtratoDepositanteData) returns (ServiceResponseItemExtratoDepositante) {}
    rpc updateItemExtratoDepositante (ItemExtratoDepositanteUpdateRequest) returns (ServiceResponseItemExtratoDepositante) {}
    rpc removeItemExtratoDepositante (IdRequest) returns (ServiceResponseItemExtratoDepositante) {}

    rpc listCriticaExtrato (ListCriteriaRequestCriticaExtrato) returns (ServiceResponseListCriticaExtrato) {}
    rpc findOneCriticaExtrato (IdRequest) returns (ServiceResponseCriticaExtrato) {}
    rpc createCriticaExtrato (CriticaExtratoData) returns (ServiceResponseCriticaExtrato) {}
    rpc updateCriticaExtrato (CriticaExtratoUpdateRequest) returns (ServiceResponseCriticaExtrato) {}
    rpc removeCriticaExtrato (IdRequest) returns (ServiceResponseCriticaExtrato) {}

    rpc listTipoDeposito (ListCriteriaRequestTipoDeposito) returns (ServiceResponseListTipoDeposito) {}
    rpc findOneTipoDeposito (IdRequest) returns (ServiceResponseTipoDeposito) {}
    rpc createTipoDeposito (TipoDepositoData) returns (ServiceResponseTipoDeposito) {}
    rpc updateTipoDeposito (TipoDepositoUpdateRequest) returns (ServiceResponseTipoDeposito) {}
    rpc removeTipoDeposito (IdRequest) returns (ServiceResponseTipoDeposito) {}

    rpc listStatusDeposito (ListCriteriaRequestStatusDeposito) returns (ServiceResponseListStatusDeposito) {}
    rpc findOneStatusDeposito (IdRequest) returns (ServiceResponseStatusDeposito) {}
    rpc createStatusDeposito (StatusDepositoData) returns (ServiceResponseStatusDeposito) {}
    rpc updateStatusDeposito (StatusDepositoUpdateRequest) returns (ServiceResponseStatusDeposito) {}
    rpc removeStatusDeposito (IdRequest) returns (ServiceResponseStatusDeposito) {}

    rpc listStatusExtrato (ListCriteriaRequestStatusExtrato) returns (ServiceResponseListStatusExtrato) {}
    rpc findOneStatusExtrato (IdRequest) returns (ServiceResponseStatusExtrato) {}
    rpc createStatusExtrato (StatusExtratoData) returns (ServiceResponseStatusExtrato) {}
    rpc updateStatusExtrato (StatusExtratoUpdateRequest) returns (ServiceResponseStatusExtrato) {}
    rpc removeStatusExtrato (IdRequest) returns (ServiceResponseStatusExtrato) {}
}

message IdRequest{
    int32 id = 1;
}

//ITEMCONFERENCIA (porte de vsgaExtrato_ObterItensConferencia)

// Cada grade da tela e uma consulta separada com paginacao propria -
// RadGrid1 (Identificados) via IDENTIFICADOS, RadGrid2/RadGrid3
// (Nao Identificados / Nao Identificados Preventivo) via os outros dois,
// filtrados por cd_tipo_escrituracao (replica ObterDados() do code-behind).
enum TipoListaConferencia {
    IDENTIFICADOS = 0;
    NAO_IDENTIFICADOS = 1;
    NAO_IDENTIFICADOS_PREVENTIVO = 2;
}

message ListCriteriaRequestItemConferencia {
    TipoListaConferencia tipoLista = 1;
    // Filtro do dropdown de cobrador na tela - so aplicavel a IDENTIFICADOS
    // (compara com o nm_usuario_login do cobrador do caso, tecoCaso.id_usua_cobrador).
    int32 idUsuaCobrador = 2;
    // Usuario autenticado fazendo a chamada - usado para excluir, nas listas
    // Nao Identificadas, itens ja vinculados a ELE via ItemExtratoCobrador
    // (equivalente ao filtro por Me.UsuarioLogado.id_usuario no legado).
    int32 idUsuarioLogado = 3;
    int32 items = 4;
    int32 page = 5;
    map<string, string> order = 6;
}

// Uma linha das grades da tela de Conferência de Depósitos - equivalente
// a vsgaExtrato_ObterItensConferencia, já com os campos calculados que
// hoje vivem em RadGrid1_ItemDataBound (percentual/tooltip/habilitação),
// pra o frontend só exibir, sem recalcular.
message ItemConferenciaData {
    int32 idItemExtrato = 1;
    string dtRegistro = 2;
    string cdCnpjCpf = 3;
    int32 idCaso = 4;
    double nuValor = 5;
    string nmDevedor = 6;
    string tipoDeposito = 7;
    int32 idAgencia = 8;
    string desMunicipio = 9;
    string codFederacao = 10;
    string nmCliente = 11;
    string nmUsuarioLogin = 12;
    string desForma = 13;
    string deCritica = 14;
    int32 idStatusDeposito = 15;
    string dtExtrato = 16;
    string nuConta = 17;
    string cdStatus = 18;
    string desStatusCobranca = 19;
    bool cdTipoEscrituracao = 20;
    double valorParcelasEsperado = 21;
    bool chkSelecionarHabilitado = 22;
    string chkSelecionarTooltip = 23;
    bool chkSelAgrupadoVisivel = 24;
    string obsExistente = 25;
}

message ServiceResponseListItemConferencia {
    int32 status = 1;
    string message = 2;
    ListResultItemConferencia data = 3;
    string error = 4;
}

message ListResultItemConferencia {
    repeated ItemConferenciaData result = 1;
    int32 total = 2;
}

//COBRADOR (porte de vsgaUsuario_ListaCobradores)

message ListCriteriaRequestCobrador {
    int32 items = 1;

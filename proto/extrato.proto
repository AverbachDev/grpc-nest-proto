message ListCriteriaRequestExtratoResumo {
    string dtExtratoInicio = 1;
    string dtExtratoFim = 2;
    string deExtrato = 3;
    // false=wfmListaExtrato.aspx (normal), true=wfmListaExtratoBoston.aspx.

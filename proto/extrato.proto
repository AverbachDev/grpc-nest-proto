message ListCriteriaRequestExtrato {
    string dtExtratoInicio = 1;
    string dtExtratoFim = 2;
    int32 idStatusExtrato = 3;
    int32 items = 4;
    int32 page = 5;
    map<string, string> order = 6;
}

message ExtratoData {
    int32 id = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    int32 idStatusExtrato = 4;
    int32 idUsuaOper = 5;
    string dtRegistro = 6;
    bool cdTipoExtrato = 7;
    string createdDate = 8;
    string updatedDate = 9;
    string deletedDate = 10;
    // Chave do objeto gravado no MinIO (arquivo CNAB/planilha original
    // importado ao salvar) - null quando o extrato foi criado sem arquivo
    // (ex.: so digitacao manual) ou salvo antes desse campo existir.
    optional string deArquivoOriginal = 11;
}

message ExtratoUpdateRequest{
    int32 id = 1;
    ExtratoData extrato = 2;
}


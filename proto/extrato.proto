//EXTRATORESUMO (porte de vsgaExtrato_ObterLista - wfmListaExtrato.aspx/wfmListaExtratoBoston.aspx)

message ListCriteriaRequestExtratoResumo {
    string dtExtratoInicio = 1;
    string dtExtratoFim = 2;
    string deExtrato = 3;
    // false=wfmListaExtrato.aspx (normal), true=wfmListaExtratoBoston.aspx.
    bool cdTipoExtrato = 4;
    int32 items = 5;
    int32 page = 6;
    map<string, string> order = 7;
}

message ExtratoResumoData {
    int32 idExtrato = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    int32 idStatusExtrato = 4;
    string deStatusExtrato = 5;
    // SUM(ItemExtrato.nuValor - nuValorDevolvido), excluindo itens
    // estornados/devolvidos - nao e o Extrato.id, e um agregado calculado.
    double nuValor = 6;
    bool cdTipoExtrato = 7;
}

message ServiceResponseListExtratoResumo {
    int32 status = 1;
    string message = 2;
    ListResultExtratoResumo data = 3;
    string error = 4;
}

message ListResultExtratoResumo {
    repeated ExtratoResumoData result = 1;
    int32 total = 2;
}

//CADASTRO MANUAL (porte de wfmCadExtrato.aspx / wfmCadExtratoBoston.aspx -
//"feature #1": grade editavel de N depositos com auto-complete)

message GetExtratoDetalheRequest {
    int32 idExtrato = 1;
}

message ItemExtratoDetalheData {
    int32 idItemExtrato = 1;
    int32 idFederacao = 2;
    int32 idMunicipio = 3;
    int32 idAgencia = 4;
    int32 idTipoDeposito = 5;
    double nuValor = 6;
    int32 idCaso = 7;
    string cdCnpjCpf = 8;
    // Ja calculado no backend (Integral/Parcelado - X/Parcelado - X Y/Por
    // Titulos/Por Conta), igual ao des_forma dos demais usecases de Extrato.
    string desForma = 9;
    string nmDevedor = 10;
    string nmCliente = 11;
    string nmUsuarioLogin = 12;
    int32 idCritica = 13;
    string deCritica = 14;
    repeated int32 idsParcela = 15;
    string deObs = 16;
}

message ExtratoDetalheData {
    int32 idExtrato = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    int32 idStatusExtrato = 4;
    bool cdTipoExtrato = 5;
    repeated ItemExtratoDetalheData itens = 6;
    // Presente quando este extrato tem um arquivo original (CNAB/planilha)
    // gravado no MinIO - usado pelo front pra mostrar o botao de download.
    optional string deArquivoOriginal = 7;
}

message ServiceResponseExtratoDetalhe {
    int32 status = 1;
    string message = 2;
    ExtratoDetalheData data = 3;
    string error = 4;
}

message ItemExtratoInputData {
    // 0 = deposito novo (ainda nao existe em ItemExtrato).
    int32 idItemExtrato = 1;
    int32 idFederacao = 2;
    int32 idMunicipio = 3;
    int32 idAgencia = 4;
    int32 idTipoDeposito = 5;
    double nuValor = 6;
    int32 idCaso = 7;
    string cdCnpjCpf = 8;
    // Parcelas identificadas via auto-complete (listParcelaPrevPagto,
    // microservice-caso) - pode ter mais de uma quando ha varias parcelas
    // do mesmo caso vencendo na mesma data (mesma regra do popup).
    repeated int32 idsParcela = 9;
    // Observacao do depositante (cheque/malote sem identificacao) - porte
    // de tecoItemExtratoDepositante.de_obs.
    string deObs = 10;
}

message SalvarExtratoRequest {
    // 0 = extrato novo.
    int32 idExtrato = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    // false=wfmCadExtrato.aspx (normal), true=wfmCadExtratoBoston.aspx.
    bool cdTipoExtrato = 4;
    // Equivale a btnLiberar_Click (id_statusextrato=2, id_statusdeposito=1
    // em cada item) quando true; a MasterPage_Salvar (so grava) quando false.
    bool liberar = 5;
    repeated ItemExtratoInputData itens = 6;
    int32 idUsuaOper = 7;
    // Nome do arquivo original importado (CNAB/planilha) - o conteudo em si
    // ja foi enviado antes, na selecao do arquivo (ver importarArquivoExtrato
    // abaixo), e esta em "depositos/Recebidos/<nome>" no MinIO. Presente so
    // quando o Salvar corresponde a uma importacao de arquivo em andamento -
    // o usecase move esse objeto pra "depositos/Processados/<nome>" (replica
    // MoverArquivo do legado). Ausente em edicao manual ou re-salvar um
    // extrato ja existente sem reimportar nada.
    optional string deNomeArquivoOriginal = 8;
}

message SalvarExtratoData {
    int32 idExtrato = 1;
}

message ServiceResponseSalvarExtrato {
    int32 status = 1;
    string message = 2;
    SalvarExtratoData data = 3;
    string error = 4;
}

// Porte de SalvarArquivo (wfmCadExtrato.aspx.vb) - roda na SELECAO do
// arquivo (antes de interpretar/preencher a grade), nao no Salvar. Bloqueia
// (erro na ServiceResponse) se um arquivo de mesmo nome ja existir em
// "depositos/Processados/" (mesma checagem do legado: "O Arquivo informado
// ja foi importado anteriormente."); senao grava em "depositos/Recebidos/"
// e devolve sucesso - o Salvar (SalvarExtratoRequest.deNomeArquivoOriginal
// acima) depois move pra Processados.
message ImportarArquivoExtratoRequest {
    string nomeArquivo = 1;
    string conteudoBase64 = 2;
}

message ImportarArquivoExtratoData {
    string chaveRecebido = 1;
}

message ServiceResponseImportarArquivoExtrato {
    int32 status = 1;
    string message = 2;
    ImportarArquivoExtratoData data = 3;
    string error = 4;
}

message ArquivoExtratoData {
    string nomeArquivo = 1;
    string conteudoBase64 = 2;
}

message ServiceResponseArquivoExtrato {
    int32 status = 1;
    string message = 2;
    ArquivoExtratoData data = 3;
    string error = 4;
}

//ITEMPENDENTEAPROVACAO (porte de vsgaExtrato_ObterItensPendentesAprovacao -
//wfmListaDepositosPendentesAprovacao.aspx)

enum TipoListaPendenteAprovacao {
    NORMAL = 0;
    PREVENTIVO = 1;
}

message ListCriteriaRequestItemPendenteAprovacao {
    TipoListaPendenteAprovacao tipoLista = 1;
    // Usuario autenticado fazendo a chamada - quem nao e Administrador so
    // ve o que foi vinculado a ele (equivalente a nm_usuario_login = login
    // do usuario logado no legado, aqui comparado por ID).
    int32 idUsuarioLogado = 2;
    bool ehAdministrador = 3;
    string nmDevedor = 4;
    string cdCnpjCpf = 5;
    double nuValorInicio = 6;
    double nuValorFim = 7;
    int32 items = 8;
    int32 page = 9;
    map<string, string> order = 10;
}

message ItemPendenteAprovacaoData {
    // 0 quando o item vem do bloco "Cheques Por Malote" (sem vinculo de
    // cobrador ainda) - replica o UNION ALL da view legada.
    int32 idItemExtratoCob = 1;
    int32 idItemExtrato = 2;
    string cdCnpjCpf = 3;
    int32 idCaso = 4;
    double nuValor = 5;
    string nmDevedor = 6;
    string tipoDeposito = 7;
    int32 idAgencia = 8;
    string desMunicipio = 9;
    string codFederacao = 10;
    string nmCliente = 11;
    string nmUsuarioLogin = 12;
    string desForma = 13;
    string deCritica = 14;
    int32 idStatusDeposito = 15;
    string dtExtrato = 16;
    string nuConta = 17;
    bool cdTipoEscrituracao = 18;
}

message ServiceResponseListItemPendenteAprovacao {
    int32 status = 1;
    string message = 2;
    ListResultItemPendenteAprovacao data = 3;
    string error = 4;
}

message ListResultItemPendenteAprovacao {
    repeated ItemPendenteAprovacaoData result = 1;
    int32 total = 2;
}

//ACOES DE ESCRITA (porte de btnLiberar_Click/btnRetornar_Click/btnEstornar_Click
//de wfmListaDepositosPendentesAprovacao.aspx.vb)

message EscriturarDepositoRequest {
    int32 idItemExtrato = 1;
    // 0 se o item veio do bloco "Cheques Por Malote" (sem vinculo ainda).
    int32 idItemExtratoCob = 2;
    // Casos distintos envolvidos nas parcelas escolhidas no popup de busca
    // (wfmpopBuscaExtrato.aspx) - o backend busca cada um via
    // GrpcCasoProvider.findOneCaso pra descobrir a qual caso cada
    // idParcela pertence, sem confiar em dado vindo do cliente pra isso.
    repeated int32 idsCaso = 3;
    repeated int32 idsParcela = 4;
    bool cdTipoEscrituracao = 5;
    int32 idUsuaOper = 6;
}

message EscriturarDepositoData {
    // ids dos DepositosEfetuados criados no microservice-pagamento - mais
    // de um quando as parcelas cobrem mais de 2 casos distintos (desmembra
    // o deposito, replicando a regra do legado).
    repeated int32 idsDeposito = 1;
}

message ServiceResponseEscriturarDeposito {
    int32 status = 1;
    string message = 2;
    EscriturarDepositoData data = 3;
    string error = 4;
}

message RetornarDepositoRequest {
    int32 idItemExtrato = 1;
    int32 idItemExtratoCob = 2;
    int32 idUsuaOper = 3;
}

message EstornarDepositoRequest {
    int32 idItemExtrato = 1;
    int32 idItemExtratoCob = 2;
    int32 idUsuaOper = 3;
}

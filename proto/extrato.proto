    int32 page = 6;
    map<string, string> order = 7;
}

message ExtratoResumoData {
    int32 idExtrato = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    int32 idStatusExtrato = 4;
    string deStatusExtrato = 5;
    // SUM(ItemExtrato.nuValor - nuValorDevolvido), excluindo itens
    // estornados/devolvidos - nao e o Extrato.id, e um agregado calculado.
    double nuValor = 6;
    bool cdTipoExtrato = 7;
}

message ServiceResponseListExtratoResumo {
    int32 status = 1;
    string message = 2;
    ListResultExtratoResumo data = 3;
    string error = 4;
}

message ListResultExtratoResumo {
    repeated ExtratoResumoData result = 1;
    int32 total = 2;
}

//ITEMPENDENTEAPROVACAO (porte de vsgaExtrato_ObterItensPendentesAprovacao -

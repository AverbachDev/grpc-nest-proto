message IdRequest {
    int32 id = 1;
}

//SegmentoProduto
message ListCriteriaRequestSegmentoProduto {
    int32 idSegmento = 1;
    int32 idProduto = 2;
    int32 idUsuOpe = 3;
    int32 items = 4;
    int32 page = 5;
    map<string, string> order = 6;
}

message SegmentoProdutoData {
    int32 id = 1;
    int32 idSegmento = 2;
    int32 idProduto = 3;
    int32 idUsuOpe = 4;
    string deRegistro = 5;
    string dtModificacao = 6;
    string createdDate = 7;
    string updatedDate = 8;
    string deletedDate = 9;
}

message SegmentoProdutoUpdateRequest {
    int32 id = 1;
    SegmentoProdutoData segmentoProduto = 2;
}

message ServiceResponseSegmentoProduto {
    int32 status = 1;
    string message = 2;
    repeated SegmentoProdutoData data = 3;
    string error = 4;
}

message ListResultSegmentoProduto {
    repeated SegmentoProdutoData result = 1;
    int32 total = 2;
}

message ServiceResponseListSegmentoProduto {
    int32 status = 1;
    string message = 2;
    ListResultSegmentoProduto data = 3;
    string error = 4;
}

//Agenda
message ListCriteriaRequestAgenda {
    int32 idPromoter = 1;
    int32 idUsuOpe = 2;
    int32 items = 3;
    int32 page = 4;
    map<string, string> order = 5;
}

message AgendaData {
    int32 id = 1;
    int32 idPromoter = 2;
    string dtAgenda = 3;
    int32 idUsuOpe = 4;
    string dtRegistro = 5;
    string dtModificacao = 6;
    string createdDate = 7;
    string updatedDate = 8;
    string deletedDate = 9;
}

message AgendaUpdateRequest {
    int32 id = 1;
    AgendaData agenda = 2;
}

message ServiceResponseAgenda {
    int32 status = 1;
    string message = 2;
    repeated AgendaData data = 3;
    string error = 4;
}

message ListResultAgenda {
    repeated AgendaData result = 1;
    int32 total = 2;
}

message ServiceResponseListAgenda {
    int32 status = 1;
    string message = 2;
    ListResultAgenda data = 3;
    string error = 4;
}


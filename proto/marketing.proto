    int32 idEmpresa = 4;
    string cdHorario = 5;
    string dtConfirmacao = 6;
    bool cdAvaliacao = 7;
    string dtAvaliacao = 8;
    int32 idPromoterInterno = 9;
    bool cdResultVisita = 10;
    bool cdBriefing = 11;
    string dtSugerida = 12;
    string deObs = 13;
    int32 idUsuOpe = 14;
    string dtRegistro = 15;
    string cdTipoVisita = 16;
    string dtModificacao = 17;
    string createdDate = 18;
    string updatedDate = 19;
    string deletedDate = 20;
}

message AgendaHorarioUpdateRequest {

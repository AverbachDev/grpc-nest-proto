syntax = "proto3";

package historico;


service HistoricoService {
  //Contrato
  rpc listHistorico (ListCriteriaRequestHistorico) returns (ServiceResponseListHistorico) {}
  rpc findOneHistorico (IdRequest) returns (ServiceResponseHistorico) {}
  rpc createHistorico (HistoricoData) returns (ServiceResponseHistorico) {}
  rpc updateHistorico (HistoricoUpdateRequest) returns (ServiceResponseHistorico) {}
  rpc removeHistorico (IdRequest) returns (ServiceResponseHistorico) {}
  rpc findHistoricosCaso (IdRequest) returns (ServiceResponseCasoHistorico) {}
  // E-mail em massa (ex-Rotinas_EmailEmMassa.exe). Escrevem direto no SQL Server
  // com o relogio do banco (GETDATE) e cd_historico = 0, como o legado - o
  // createHistorico normal grava cd_historico NULL e em UTC, o que quebraria a
  // deduplicacao "caso ja recebeu e-mail hoje" feita por tecoHistorico.
  rpc registrarHistoricoEmailMassa (RegistrarHistoricoEmailMassaRequest) returns (ServiceResponseEmailMassa) {}
  rpc iniciarLoteEmailMassa (IniciarLoteEmailMassaRequest) returns (ServiceResponseEmailMassa) {}
  rpc finalizarLoteEmailMassa (FinalizarLoteEmailMassaRequest) returns (ServiceResponseEmailMassa) {}

}

message IdRequest{
    int32 id = 1;
}


//Historico

message ListCriteriaRequestHistorico {
    int32 idCaso = 1;
    bool cdSite = 2;
    string deDescricao = 3;
    int32 cdHistorico = 4;
    int32 items = 5;
    int32 page = 6;
    map<string, string> order =7;
}

message HistoricoData {
    int32 idHistorico = 1;
    int32 cdHistorico = 2;
    string deDescricao = 3;
    string dtCadastro = 4;
    bool cdSite = 5;
    int32 idUsuaOper = 6;
    string dtRegistro = 7;
    int32 idCaso = 8;
    bool cdPrioridade = 9;
    int32 idResponsavel = 10;
    string dtLimite = 11;
    int32 idStatusHistorico = 12;
    string createdDate = 13;
    string updatedDate = 14;
    string deletedDate = 15;

}


message HistoricoCasoData {

    int32 idHistorico = 1;
    int32 idCaso = 2;
    int32 cdHistorico = 3;
    string dtCadastro = 4;
    string deDescricao = 5;
    int32 idUsuaOper = 6;
    bool cdSite = 7;
    bool cdPrioridade = 8;
    string dtLimite = 9;
    string nmUsuarioLogin = 10;

}

message HistoricoUpdateRequest{
    int32 idHistorico = 1;
    HistoricoData historico = 2;
}

message ServiceResponseHistorico {
    int32 status = 1;
    string message = 2;
    repeated HistoricoData data = 3;
    string error = 4;
}


message ServiceResponseCasoHistorico {
    int32 status = 1;
    string message = 2;
    repeated HistoricoCasoData data = 3;
    string error = 4;
}

message ServiceResponseListHistorico {
    int32 status = 1;
    string message = 2;
    ListResultHistorico data = 3;
    string error = 4;
}

message ListResultHistorico {
    repeated HistoricoData result = 1;
    int32 total = 2;
}


// E-MAIL EM MASSA
message RegistrarHistoricoEmailMassaRequest {
    int32 idCaso = 1;
    // Texto completo do historico. Deve COMECAR com a mensagem do tipo de envio
    // (TituloEmailMassaData.deMensagemHistorico do caso), que e' a chave da deduplicacao.
    string deDescricao = 2;
}

// Lote de uma rotina (tecoHistoricoEmailMassa): serve de auditoria e, pra rotina
// 15 da Illy, de sinal de que o envio dos vencidos do dia terminou.
message IniciarLoteEmailMassaRequest {
    int32 idCliente = 1;
    // Mesma numeracao de tp_envio da procedure de e-mail em massa (0, 1 ou 3).
    int32 tpEnvio = 2;
}

message FinalizarLoteEmailMassaRequest {
    int32 idEmailMassa = 1;
    int32 qtdEnviados = 2;
}

message EmailMassaResult {
    // So preenchido em iniciarLoteEmailMassa.
    optional int32 idEmailMassa = 1;
}

message ServiceResponseEmailMassa {
    int32 status = 1;
    string message = 2;
    EmailMassaResult data = 3;
    string error = 4;
}

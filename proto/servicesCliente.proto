syntax = "proto3";

package servicesClientes;


service servicesClientesService {
    rpc consultarClienteLiquimoly (ListCriteriaRequestClienteLiquimolyAPI) returns (ServiceResponseClienteLiquimolyAPI) {}
    rpc listarContasReceberLiquimoly (ListCriteriaRequestContasReceberLiquimolyAPI) returns (ServiceResponseContasReceberLiquimolyAPI) {}
    rpc listarContasCorrentesLiquimoly (ListCriteriaRequestContasCorrentesLiquimolyAPI) returns (ServiceResponseContasCorrentesLiquimolyAPI) {}

    rpc listTitulosLiquimoly (ListCriteriaRequestTitulosLiquimoly) returns (ServiceResponseListTitulosLiquimoly) {}
    rpc findOneTitulosLiquimoly (IdRequest) returns (ServiceResponseTitulosLiquimoly) {}
    rpc createTitulosLiquimoly (TitulosLiquimolyData) returns (ServiceResponseTitulosLiquimoly) {}
    rpc updateTitulosLiquimoly (TitulosLiquimolyUpdateRequest) returns (ServiceResponseTitulosLiquimoly) {}
    rpc removeTitulosLiquimoly (IdRequest) returns (ServiceResponseTitulosLiquimoly) {}

    // Receiv: execucao manual dos crons de staging (carteira/lotes e alcadas)
    rpc sincronizarCarteiraReceiv (SincronizarCarteiraReceivRequest) returns (ServiceResponseSincronizarCarteiraReceiv) {}
    rpc sincronizarAlcadasReceiv (SincronizarAlcadasReceivRequest) returns (ServiceResponseSincronizarAlcadasReceiv) {}
    rpc simularImportacaoReceiv (SimularImportacaoReceivRequest) returns (ServiceResponseSimularImportacaoReceiv) {}
    rpc importarReceiv (ImportarReceivRequest) returns (ServiceResponseImportarReceiv) {}
    // Receiv: ocorrencias (historicos do caso). A simulacao nao envia nada.
    rpc simularOcorrenciasReceiv (OcorrenciasReceivRequest) returns (ServiceResponseOcorrenciasReceiv) {}
    rpc enviarOcorrenciasReceiv (OcorrenciasReceivRequest) returns (ServiceResponseOcorrenciasReceiv) {}
}

message OcorrenciasReceivRequest {
    string dtInicio = 1; // YYYY-MM-DD; so a simulacao usa (o envio le RECEIV_OCORRENCIA_DATA_INICIO)
}

message ItemOcorrenciaReceiv {
    int32 idHistorico = 1;
    int32 idCaso = 2;
    string dtCadastro = 3;
    string situacao = 4; // A_ENVIAR | ENVIADO | REJEITADO | INCERTO | JA_ENVIADO | SEM_CORRESPONDENCIA | AMBIGUO
    string codCliente = 5;
    int32 codOcorrencia = 6;
    string identificadorDoCobrador = 7;
    string descricaoOcorrencia = 8;
    string observacoesAdicionais = 9;
    string mensagem = 10;
}

message ResumoOcorrenciasReceiv {
    int32 total = 1;
    int32 aEnviar = 2;
    int32 enviados = 3;
    int32 rejeitados = 4;
    int32 incertos = 5;
    int32 jaEnviados = 6;
    int32 semCorrespondencia = 7;
    int32 ambiguos = 8;
    int32 regrasAtivas = 9;
    string dtInicio = 10;
    repeated ItemOcorrenciaReceiv itens = 11; // no maximo 500
}

message ServiceResponseOcorrenciasReceiv {
    int32 status = 1;
    string message = 2;
    repeated ResumoOcorrenciasReceiv data = 3;
    string error = 4;
}

message ImportarReceivRequest {
    int32 idUsuaOper = 1;
    // Importa mesmo se nenhum titulo da carteira for reconhecido no SGA (de-para suspeito).
    bool confirmarSemCorrespondencia = 2;
}

message ItemImportacaoReceiv {
    string codTitulo = 1;
    string deDoc = 2;
    string nome = 3;
    bool importado = 4;
    string mensagem = 5;
    int32 idCaso = 6;
    int32 idTitulo = 7;
}

message ResumoImportacaoReceiv {
    int32 importados = 1;
    int32 falhas = 2;
    int32 jaCadastrados = 3;
    int32 conferir = 4;
    int32 invalidos = 5;
    repeated ItemImportacaoReceiv itens = 6;
}

message ServiceResponseImportarReceiv {
    int32 status = 1;
    string message = 2;
    repeated ResumoImportacaoReceiv data = 3;
    string error = 4;
}

message SimularImportacaoReceivRequest {
}

message ItemSimulacaoReceiv {
    string situacao = 1; // NOVO | JA_CADASTRADO | CONFERIR | INVALIDO
    string observacao = 2;
    int32 idCliente = 3;
    string nome = 4;
    string cdCnpjCpf = 5;
    string deDoc = 6;
    string codTitulo = 7;
    string vencimento = 8;
    double valor = 9;
    int32 idCaso = 10;
    int32 idTitulo = 11;
    bool devedorNovo = 12;
}

message ResumoSimulacaoReceiv {
    int32 total = 1;
    int32 novos = 2;
    int32 jaCadastrados = 3;
    int32 conferir = 4;
    int32 invalidos = 5;
    int32 devedoresNovos = 6;
    int32 registrosConferem = 7; // quantos cod_titulo ja existem como de_titulo_ar: valida o mapeamento
    repeated ItemSimulacaoReceiv itens = 8;
}

message ServiceResponseSimularImportacaoReceiv {
    int32 status = 1;
    string message = 2;
    repeated ResumoSimulacaoReceiv data = 3;
    string error = 4;
}

message ListCriteriaRequestClienteLiquimolyAPI{
    string codigoCliente = 1;
}

message ServiceResponseClienteLiquimolyAPI{
    int32 status = 1;
    string message = 2;
    repeated ClienteLiquimolyAPIData data = 3;
    string error = 4;        
}

message ListCriteriaRequestContasReceberLiquimolyAPI{
    int32 pagina = 1;
    int32 registrosPorPagina = 2;
    string filtrarPorEmissaoDe = 3;
    string filtrarPorEmissaoAte = 4;
    string filtrarApenasTitulosEmAberto = 5;
}

message ServiceResponseContasReceberLiquimolyAPI{
    int32 status = 1;
    string message = 2;
    repeated ContasReceberLiquimolyAPIData data = 3;
    string error = 4;        
}

message ListCriteriaRequestContasCorrentesLiquimolyAPI{
    int32 pagina = 1;
    int32 registrosPorPagina = 2;
    string apenas_importado_api = 3;
}

message ServiceResponseContasCorrentesLiquimolyAPI{
    int32 status = 1;
    string message = 2;
    repeated ContasCorrentesLiquimolyAPIData data = 3;
    string error = 4;        
}

message ContasCorrentesLiquimolyAPIData {
  int32 nCodCC = 1;
  string cCodCCInt = 2;
  string descricao = 3;
  string codigo_banco = 4;
  string codigo_agencia = 5;
  string conta_corrente = 6;
  string nome_gerente = 7;
  string tipo = 8;
  string tipo_comunicacao = 9;
  string cSincrAnalitica = 10;
  int32 nTpTef = 11;
  double nTaxaAdm = 12;
  int32 nDiasVenc = 13;
  int32 nNumParc = 14;
  int32 nCodAdm = 15;
  string cUtilPDV = 16;
  string cCategoria = 17;
  string cModalidade = 18;
  double saldo_inicial = 19;
  string saldo_data = 20; // Supondo que seja string (timestamp ISO, exemplo); se for timestamp, pode usar google.protobuf.Timestamp
  double valor_limite = 21;
  string cTipoCartao = 22;
}

// ContasReceber message definition
message ContasReceberLiquimolyAPIData {
  Boleto boleto = 1;
  repeated Categoria categorias = 2;
  string chave_nfe = 3;
  string codigo_barras_ficha_compensacao = 4;
  string codigo_categoria = 5;
  int64 codigo_cliente_fornecedor = 6;
  string codigo_lancamento_integracao = 7;
  int64 codigo_lancamento_omie = 8;
  string codigo_tipo_documento = 9;
  int64 codigo_vendedor = 10;
  string data_emissao = 11;
  string data_previsao = 12;
  string data_registro = 13;
  string data_vencimento = 14;
  repeated string distribuicao = 15; // 'any[]' mapped as repeated string, adjust as needed
  int64 id_conta_corrente = 16;
  string id_origem = 17;
  Info info = 18;
  int64 nCodPedido = 19;
  string numero_documento_fiscal = 20;
  string numero_parcela = 21;
  string numero_pedido = 22;
  string operacao = 23;
  string retem_cofins = 24;
  string retem_csll = 25;
  string retem_inss = 26;
  string retem_ir = 27;
  string retem_iss = 28;
  string retem_pis = 29;
  string status_titulo = 30;
  string tipo_agrupamento = 31;
  double valor_documento = 32;
}

message Boleto {
  string cGerado = 1;
  string cNumBancario = 2;
  string cNumBoleto = 3;
  string dDtEmBol = 4;
  double nPerJuros = 5;
  double nPerMulta = 6;
}

message Categoria {
  string codigo_categoria = 1;
  double percentual = 2;
  double valor = 3;
}

message Info {
  string cImpAPI = 1;
  string dAlt = 2;
  string dInc = 3;
  string hAlt = 4;
  string hInc = 5;
  string uAlt = 6;
  string uInc = 7;
}


// Cliente message definition
message ClienteLiquimolyAPIData {
  int64 codigo_cliente_omie = 1;
  string codigo_cliente_integracao = 2;
  string razao_social = 3;
  string cnpj_cpf = 4;
  string nome_fantasia = 5;
  string telefone1_ddd = 6;
  string telefone1_numero = 7;
  string contato = 8;
  string endereco = 9;
  string endereco_numero = 10;
  string bairro = 11;
  string complemento = 12;
  string estado = 13;
  string cidade = 14;
  string cep = 15;
  string codigo_pais = 16;
  string separar_endereco = 17;
  string pesquisar_cep = 18;
  string telefone2_ddd = 19;
  string telefone2_numero = 20;
  string fax_ddd = 21;
  string fax_numero = 22;
  string email = 23;
  string homepage = 24;
  string inscricao_estadual = 25;
  string inscricao_municipal = 26;
  string inscricao_suframa = 27;
  string optante_simples_nacional = 28;
  string tipo_atividade = 29;
  string cnae = 30;
  string produtor_rural = 31;
  string contribuinte = 32;
  string observacao = 33;
  string obs_detalhadas = 34;
  string recomendacao_atraso = 35;
  repeated Tag tags = 36;
  string pessoa_fisica = 37;
  string exterior = 38;
  string logradouro = 39;
  string importado_api = 40;
  string bloqueado = 41;
  string cidade_ibge = 42;
  double valor_limite_credito = 43;
  string bloquear_faturamento = 44;
  Recomendacoes recomendacoes = 45;
  EnderecoEntrega enderecoEntrega = 46;
  string nif = 47;
  string documento_exterior = 48;
  string inativo = 49;
  DadosBancarios dadosBancarios = 50;
  repeated string caracteristicas = 51;
  string enviar_anexos = 52;
  Info info = 53;
  string bloquear_exclusao = 54;
}

message Tag {
  string tag = 1;
}

message Recomendacoes {
  int64 codigo_vendedor = 1;
  string gerar_boletos = 2;
}

message EnderecoEntrega {
  string entBairro = 1;
  string entCEP = 2;
  string entCidade = 3;
  string entCnpjCpf = 4;
  string entEndereco = 5;
  string entEstado = 6;
  string entNumero = 7;
}

message DadosBancarios {
  string agencia = 1;
  string cChavePix = 2;
  string codigo_banco = 3;
  string conta_corrente = 4;
  string doc_titular = 5;
  string nome_titular = 6;
  string transf_padrao = 7;
}


message IdRequest{
    int32 id = 1;
}

message ServiceResponseBoolean {
    int32 status = 1;
    string message = 2;
    bool data = 3;
    string error = 4;
}


//TITULOS LIQUIMOLY

message ListCriteriaRequestTitulosLiquimoly {
    string numeroDocumentoFiscal = 1;
    string dataPrevisao = 2;
    double valorDocumento = 3;
    int32 codigoLancamentoOmie = 4;
    int32 dataBaixa = 5;
    int32 items = 6;
    int32 page = 7;
    map<string, string> order = 8;
}

message TitulosLiquimolyData {
    int32 id = 1;
    int32 codigoLancamentoOmie = 2;
    string dataPrevisao = 3;
    double valorDocumento = 4;
    string numeroDocumentoFiscal = 5;
    string numeroParcela = 6;
    int32 idTitulo = 7;
    int32 idCaso = 8;
    string dataBaixa = 9;
    string createdDate = 10;
    string updatedDate = 11;
    string deletedDate = 12;
}

message TitulosLiquimolyUpdateRequest{
    int32 id = 1;
    TitulosLiquimolyData titulosLiquimoly = 2;
}

message ServiceResponseTitulosLiquimoly {
    int32 status = 1;
    string message = 2;
    repeated TitulosLiquimolyData data = 3;
    string error = 4;
}

message ServiceResponseListTitulosLiquimoly {
    int32 status = 1;
    string message = 2;
    ListResultTitulosLiquimoly data = 3;
    string error = 4;
}

message ListResultTitulosLiquimoly {
    repeated TitulosLiquimolyData result = 1;
    int32 total = 2;
}

message SincronizarCarteiraReceivRequest {
    repeated string origens = 1; // CARTEIRA e/ou LOTES; vazio = as duas
}

message ResumoCargaReceiv {
    string origem = 1;
    int32 idCarga = 2;
    string status = 3; // COMPLETA | INCOMPLETA | ERRO | IGNORADA
    int32 totalClientes = 4;
    int32 clientesRecebidos = 5;
    int32 titulosRecebidos = 6;
    int32 paginas = 7;
    string erro = 8;
}

message ServiceResponseSincronizarCarteiraReceiv {
    int32 status = 1;
    string message = 2;
    repeated ResumoCargaReceiv data = 3;
    string error = 4;
}

message SincronizarAlcadasReceivRequest {
}

message ResumoAlcadasReceiv {
    int32 idCarga = 1;
    string status = 2;
    int32 alcadas = 3;
    string erro = 4;
}

message ServiceResponseSincronizarAlcadasReceiv {
    int32 status = 1;
    string message = 2;
    repeated ResumoAlcadasReceiv data = 3;
    string error = 4;
}

    string nossoNumero = 1;
    double nuValor = 2;
    string motivo = 3;
}

// itens = depositos identificados (tipo Boleto) prontos para entrar na grade; naoImportados = titulos pagos que nao
// puderam ser ligados a uma nota (o legado os descartava em silencio); qtdIgnorados = boletos de cobranca (nosso numero 118...)
// e ocorrencias diferentes de liquidacao; avisos = falhas por agencia na API (as demais agencias seguem).
message ImportacaoExtratoNfData {
    repeated ItemExtratoNfData itens = 1;
    repeated TituloNaoImportadoExtratoNfData naoImportados = 2;
    int32 qtdIgnorados = 3;
    repeated string avisos = 4;
}

message ServiceResponseImportacaoExtratoNf {
    int32 status = 1;
    string message = 2;
    repeated ImportacaoExtratoNfData data = 3;
    string error = 4;
}

// Dados cadastrais do cliente de uma nota fiscal (somente leitura): razao social, CNPJ/CPF, endereco, contato.
message ClienteNfData {
    int32 idCliente = 1;
    string nmCliente = 2; // razao social
    string nmFantasia = 3;
    string cdCnpjCpf = 4;
    string deInscEstadual = 5;
    string deInscMunicipal = 6;
    string deLogradouro = 7;
    string deComplemento = 8;
    string deBairro = 9;
    string desMunicipio = 10;
    string codFederacao = 11; // UF
    string deCep = 12;
    string deTelefone = 13; // com DDD
    string deEmail = 14;
    bool inativo = 15;
}

message ServiceResponseClienteNf {
    int32 status = 1;
    string message = 2;
    repeated ClienteNfData data = 3;
    string error = 4;
}

// ---------------------------------------------------------------------------------------------------------------
// Controle de contas a receber (dashboard). Titulo a receber = uma nota fiscal.
// nuReceber = repasses BRUTO (cd_repasse 1 ou 3) + tarifa do boleto - imposto retido (igual ao valor cobrado no boleto).
// origem: CREDITO (prestacao de contas) | MANUAL | ATIVO_PREVENTIVO.
// estado: A_VENCER | VENCIDA | PAGA | SEM_VALOR (nada a cobrar: repasse liquido, baixado sozinho na emissao; vem antes de
// PAGA) | LEGADO (vencida antes de 01/11/2023 sem baixa, ja
// tratada como encerrada pelo controle antigo; fora dos totais).
// Datas em AAAA-MM-DD, inclusivas. Sem dtEmissaoDe, o servidor assume os ultimos 12 meses.
// O resumo ignora o filtro "estado" (os cards mostram a distribuicao entre os estados).
// ---------------------------------------------------------------------------------------------------------------
message ListCriteriaRequestTitulosReceber {
    string nmCliente = 1;
    string nuNf = 2;
    string cdCnpjCpf = 3;
    string origem = 4;
    string estado = 5;
    string dtEmissaoDe = 6;
    string dtEmissaoAte = 7;
    string dtVencimentoDe = 8;
    string dtVencimentoAte = 9;
    int32 items = 10;   // -1 ou 0 = sem paginacao
    int32 page = 11;    // base 1
    string ordenarPor = 12;   // dtVencimento (padrao) | dtCadastro | nmCliente | nuReceber | diasAtraso | deNotafiscal
    bool decrescente = 13;
    string meioPrevisto = 14;   // BOLETO | DEPOSITO | MISTO | NAO_INFORMADO (o que o contrato do cliente preve). Vazio = todos.
    string alerta = 15;         // BAIXA_DUPLICADA | PAGO_DIFERENTE | PENDENTE_ESCRITURACAO | BOLETO_NAO_GERADO. Vazio = todos.
}

message TituloReceberData {
    int32 idNotafiscal = 1;
    int32 idCliente = 2;
    string nmCliente = 3;
    string deNotafiscal = 4;
    string dtCadastro = 5;
    string dtVencimento = 6;
    string origem = 7;
    string estado = 8;
    double nuReceber = 9;
    double nuPago = 10;
    string dtPagto = 11;
    bool possuiBoleto = 12;
    int32 diasAtraso = 13;
    string statusCobranca = 14;   // vazio | AVISADO (e-mail de inadimplencia enviado) | RETORNO (cliente respondeu)
    string meioPrevisto = 15;     // BOLETO | DEPOSITO | MISTO | NAO_INFORMADO, pelo contrato de emissao do cliente
    int32 qtdBaixas = 16;         // quantas baixas existem em tecoNotaFiscalPagamento (mais de 1 = baixa duplicada)
    double nuDiferenca = 17;      // nuPago - nuReceber, so para notas PAGA (positivo = pago a mais)
    string alerta = 18;           // conciliacao (vazio = nenhum). Ver ListCriteriaRequestTitulosReceber.alerta
}

// Conciliacao (somente leitura). Alertas, por nota (um so, na ordem):
//  BAIXA_DUPLICADA        PAGA com mais de uma baixa (a nota foi escriturada duas vezes); valor = diferenca (pago a mais)
//  PAGO_DIFERENTE         PAGA com uma baixa de valor diferente do a receber (+/- R$ 0,01); valor = diferenca liquida
//  PENDENTE_ESCRITURACAO  em aberto mas com item no Extrato NF sem baixa (falta escriturar); valor = a receber
//  BOLETO_NAO_GERADO      em aberto sem boleto, cujo contrato preve boleto; valor = a receber
message AlertaConciliacaoData {
    string alerta = 1;
    int32 qtd = 2;
    double valor = 3;
}

message MeioTitulosReceberData {
    string meio = 1;
    int32 qtdEmitido = 2;
    double totalEmitido = 3;
    int32 qtdPago = 4;
    double totalPago = 5;
    double totalAVencer = 6;
    double totalVencido = 7;
}

message ListResultTitulosReceber {
    repeated TituloReceberData result = 1;
    int32 total = 2;
}

message ServiceResponseListTitulosReceber {
    int32 status = 1;
    string message = 2;
    ListResultTitulosReceber data = 3;
    string error = 4;
}

// faixa: A_VENCER | 1_15 | 16_30 | 31_60 | 61_90 | 90_MAIS (dias de atraso)
message FaixaAgingData {
    string faixa = 1;
    int32 qtd = 2;
    double valor = 3;
}

message OrigemTitulosReceberData {
    string origem = 1;
    int32 qtdEmitido = 2;
    double totalEmitido = 3;
    int32 qtdPago = 4;
    double totalPago = 5;
    double totalAVencer = 6;
    double totalVencido = 7;
}

// totalEmitido = nuReceber das notas com algo a cobrar (A_VENCER + VENCIDA + PAGA); totalPago = valor efetivamente baixado.
message ResumoTitulosReceberData {
    double totalEmitido = 1;
    int32 qtdEmitido = 2;
    double totalPago = 3;
    int32 qtdPago = 4;
    double totalAVencer = 5;
    int32 qtdAVencer = 6;
    double totalVencido = 7;
    int32 qtdVencido = 8;
    int32 qtdSemValor = 9;
    int32 qtdLegado = 10;
    repeated FaixaAgingData aging = 11;
    repeated OrigemTitulosReceberData porOrigem = 12;
    string dtEmissaoDe = 13;   // periodo de emissao efetivamente aplicado
    string dtEmissaoAte = 14;
    repeated MeioTitulosReceberData porMeio = 15;
    repeated AlertaConciliacaoData alertas = 16;   // sempre os 4 alertas, na ordem, mesmo zerados
}

message ServiceResponseResumoTitulosReceber {
    int32 status = 1;
    string message = 2;
    repeated ResumoTitulosReceberData data = 3;
    string error = 4;
}

// ---------------------------------------------------------------------------------------------------------------
// Controle de contas a receber - Fase 3 (somente leitura). Usam o MESMO filtro de ListCriteriaRequestTitulosReceber e,
// como o resumo, ignoram "estado". Em listClientesReceber, "ordenarPor" aceita: totalVencido (padrao, decrescente quando
// vazio) | totalAberto | totalEmitido | totalPago | maiorAtraso | prazoMedio | pctNoPrazo | qtdNotas | nmCliente.
// ---------------------------------------------------------------------------------------------------------------

// Um cliente: so conta notas com algo a cobrar (A_VENCER + VENCIDA + PAGA). prazoMedio = media de dias entre o vencimento
// e o pagamento das notas pagas (negativo = pagou antes do vencimento); pctNoPrazo = % das pagas quitadas ate o vencimento.
message ClienteReceberData {
    int32 idCliente = 1;
    string nmCliente = 2;
    int32 qtdNotas = 3;
    double totalEmitido = 4;
    double totalPago = 5;
    double totalAberto = 6;     // a vencer + vencido
    double totalVencido = 7;
    int32 qtdVencidas = 8;
    int32 maiorAtraso = 9;      // dias da nota vencida mais antiga
    int32 qtdPagas = 10;
    double prazoMedio = 11;
    double pctNoPrazo = 12;
}

message ListResultClientesReceber {
    repeated ClienteReceberData result = 1;
    int32 total = 2;
}

message ServiceResponseListClientesReceber {
    int32 status = 1;
    string message = 2;
    ListResultClientesReceber data = 3;
    string error = 4;
}

// data = AAAA-MM-DD (calendario de vencimentos e de recebimentos)
message DiaPrevisaoData {
    string data = 1;
    int32 qtd = 2;
    double valor = 3;
}

// Serie mensal por mes de EMISSAO (AAAA-MM): quanto foi emitido e como esta hoje (pago, a vencer, vencido)
message MesEvolucaoData {
    string mes = 1;
    int32 qtdEmitido = 2;
    double totalEmitido = 3;
    double totalPago = 4;
    double totalAVencer = 5;
    double totalVencido = 6;
}

// Situacao das notas (cada nota em exatamente uma): A_VENCER | PAGA_NO_PRAZO | PAGA_COM_ATRASO | VENCIDA_SEM_AVISO |
// VENCIDA_AVISADA (e-mail de inadimplencia enviado) | VENCIDA_COM_RETORNO (cliente respondeu). valor = pago nas pagas e a
// receber nas demais.
message SituacaoFunilData {
    string situacao = 1;
    int32 qtd = 2;
    double valor = 3;
}

message PrazoOrigemData {
    string origem = 1;
    int32 qtdPagas = 2;
    double prazoMedio = 3;
    double pctNoPrazo = 4;
}

message PrevisaoTitulosReceberData {
    repeated DiaPrevisaoData proximos = 1;           // a vencer nos proximos 30 dias, por vencimento
    repeated DiaPrevisaoData recebidosRecentes = 2;  // baixas dos ultimos 30 dias, por data de pagamento
    repeated MesEvolucaoData mensal = 3;             // todos os meses do periodo de emissao, mesmo zerados
    repeated SituacaoFunilData situacoes = 4;        // sempre as 6 situacoes, na ordem, mesmo zeradas
    repeated PrazoOrigemData prazoPorOrigem = 5;     // sempre as 3 origens
    double prazoMedio = 6;
    double pctNoPrazo = 7;
    int32 qtdPagas = 8;
    string hoje = 9;                                 // AAAA-MM-DD (data do servidor usada nos calculos)
}

message ServiceResponsePrevisaoTitulosReceber {
    int32 status = 1;
    string message = 2;
    repeated PrevisaoTitulosReceberData data = 3;
    string error = 4;
}

// ---------------------------------------------------------------------------------------------------------------
// Controle Notas Fiscais (porte de wfmListaControleNotasFiscais.aspx): duas abas sobre o mesmo modelo de titulo
// (uma linha por nota) do controle de contas a receber.
//   ABERTAS  = sem baixa, vencimento a partir de 01/11/2023 e valor a receber > 0 (a vencer ou vencidas)
//   QUITADAS = com baixa, ou sem baixa mas vencidas antes de 01/11/2023 (o controle antigo ja as encerrou)
// ---------------------------------------------------------------------------------------------------------------

// Filtros opcionais. nuValorDe/nuValorAte (0 = sem limite) valem sobre o "Valor NF". Datas AAAA-MM-DD, inclusivas.
// Sem data de emissao inicial NAO ha periodo padrao (o legado listava todo o historico).
message ListCriteriaRequestControleNotasFiscais {
    string aba = 1;              // ABERTAS (padrao) | QUITADAS
    string nuNf = 2;             // contem
    string nmCliente = 3;        // contem
    double nuValorDe = 4;
    double nuValorAte = 5;
    string dtEmissaoDe = 6;
    string dtEmissaoAte = 7;
    string dtVencimentoDe = 8;
    string dtVencimentoAte = 9;
    int32 items = 10;            // -1 ou 0 = sem paginacao
    int32 page = 11;             // base 1
    string ordenarPor = 12;      // dtCadastro (padrao) | nmCliente | deNotafiscal | nuValor | nuValorReceber | dtVencimento | tpPagamento | nuValorPago | dtPagto
    bool decrescente = 13;       // padrao da tela: dtCadastro decrescente
}

message ControleNotaFiscalData {
    int32 idNotafiscal = 1;
    int32 idCliente = 2;
    string nmCliente = 3;
    string deNotafiscal = 4;
    string dtCadastro = 5;
    string tpPagamento = 6;          // BOLETO | DEPOSITO | MISTO (pelo contrato do cliente); vazio = nao informado
    string statusBoleto = 7;         // SIM (tem boleto) | NAO (contrato preve boleto e nao foi gerado) | NA
    double nuValor = 8;              // Valor NF: todos os repasses + tarifa do boleto
    double nuValorReceber = 9;       // repasses BRUTO + tarifa do boleto - imposto
    string dtVencimento = 10;
    double nuValorPago = 11;
    string dtPagto = 12;
    string statusPagto = 13;         // A_VENCER | VENCIDO | AVISADO (e-mail de inadimplencia enviado) | RETORNO (cliente respondeu)
    string deRetornoVencido = 14;    // texto do retorno do cliente (statusPagto = RETORNO)
    int32 diasAtraso = 15;           // so VENCIDO/AVISADO/RETORNO em aberto
    int32 diasAvisoVencido = 16;     // dias desde o aviso de inadimplencia (so AVISADO)
    bool possuiItemExtrato = 17;     // ja existe deposito dessa nota no Extrato NF (esconde "Inserir no Extrato NF")
    int32 idAgenciaPadrao = 18;      // C/C sugerida ao inserir no Extrato NF: 19 se o contrato usa o CNPJ Averbach, senao 18
}

message ListResultControleNotasFiscais {
    repeated ControleNotaFiscalData result = 1;
    int32 total = 2;
}

message ServiceResponseListControleNotasFiscais {
    int32 status = 1;
    string message = 2;
    ListResultControleNotasFiscais data = 3;
    string error = 4;
}

// Grava o retorno do cliente a uma nota cobrada como vencida (so notas ja avisadas).
message RegistrarRetornoNotaVencidaRequest {
    int32 idNotafiscal = 1;
    string deRetorno = 2;
}

// "Inserir no Extrato NF" a partir do Controle: cria o deposito da nota ja aguardando escrituracao, no extrato da data
// (criado em conferencia se nao existir; extrato do dia ainda em elaboracao e recusado). Nao escritura: a baixa continua na Escrituracao NF.
message InserirItemExtratoNfRequest {
    int32 idNotafiscal = 1;
    double nuValor = 2;
    int32 idTipodeposito = 3;
    int32 idAgencia = 4;
    string dtExtrato = 5;        // AAAA-MM-DD
    string deObs = 6;
    int32 idUsuaOper = 7;
}

syntax = "proto3";

package contasAReceber;


service ContasAReceberService {

    rpc listNotaFiscal (ListCriteriaRequestNotaFiscal) returns (ServiceResponseListNotaFiscal) {}
    rpc findOneNotaFiscal (IdRequest) returns (ServiceResponseNotaFiscal) {}
    rpc createNotaFiscal (NotaFiscalData) returns (ServiceResponseNotaFiscal) {}
    rpc updateNotaFiscal (NotaFiscalUpdateRequest) returns (ServiceResponseNotaFiscal) {}
    rpc removeNotaFiscal (IdRequest) returns (ServiceResponseNotaFiscal) {}

    rpc listItemNotaFiscal (ListCriteriaRequestItemNotaFiscal) returns (ServiceResponseListItemNotaFiscal) {}
    rpc findOneItemNotaFiscal (IdRequest) returns (ServiceResponseItemNotaFiscal) {}
    rpc createItemNotaFiscal (ItemNotaFiscalData) returns (ServiceResponseItemNotaFiscal) {}
    rpc updateItemNotaFiscal (ItemNotaFiscalUpdateRequest) returns (ServiceResponseItemNotaFiscal) {}
    rpc removeItemNotaFiscal (IdRequest) returns (ServiceResponseItemNotaFiscal) {}

    rpc listBoletoNotaFiscal (ListCriteriaRequestBoletoNotaFiscal) returns (ServiceResponseListBoletoNotaFiscal) {}
    rpc findOneBoletoNotaFiscal (IdRequest) returns (ServiceResponseBoletoNotaFiscal) {}
    rpc createBoletoNotaFiscal (BoletoNotaFiscalData) returns (ServiceResponseBoletoNotaFiscal) {}
    rpc updateBoletoNotaFiscal (BoletoNotaFiscalUpdateRequest) returns (ServiceResponseBoletoNotaFiscal) {}
    rpc removeBoletoNotaFiscal (IdRequest) returns (ServiceResponseBoletoNotaFiscal) {}

    rpc listBoletoNotaFiscalRemessa (ListCriteriaRequestBoletoNotaFiscalRemessa) returns (ServiceResponseListBoletoNotaFiscalRemessa) {}
    rpc findOneBoletoNotaFiscalRemessa (IdRequest) returns (ServiceResponseBoletoNotaFiscalRemessa) {}
    rpc createBoletoNotaFiscalRemessa (BoletoNotaFiscalRemessaData) returns (ServiceResponseBoletoNotaFiscalRemessa) {}
    rpc updateBoletoNotaFiscalRemessa (BoletoNotaFiscalRemessaUpdateRequest) returns (ServiceResponseBoletoNotaFiscalRemessa) {}
    rpc removeBoletoNotaFiscalRemessa (IdRequest) returns (ServiceResponseBoletoNotaFiscalRemessa) {}
    rpc SendBoletoNotaFiscalToBradesco (IdRequest) returns (ServiceResponseRegistroBoletoAPI) {}
    rpc SendRangeBoletoNotaFiscalToBradesco (RequestSendRangeBoletoToBradesco) returns (ServiceResponseBoolean) {}

    rpc listBoletoAVBRemessa (ListCriteriaRequestBoletoAVBRemessa) returns (ServiceResponseListBoletoAVBRemessa) {}
    rpc findOneBoletoAVBRemessa (IdRequest) returns (ServiceResponseBoletoAVBRemessa) {}
    rpc createBoletoAVBRemessa (BoletoAVBRemessaData) returns (ServiceResponseBoletoAVBRemessa) {}
    rpc updateBoletoAVBRemessa (BoletoAVBRemessaUpdateRequest) returns (ServiceResponseBoletoAVBRemessa) {}
    rpc removeBoletoAVBRemessa (IdRequest) returns (ServiceResponseBoletoAVBRemessa) {}
    rpc SendBoletoAVBToBradesco (IdRequest) returns (ServiceResponseRegistroBoletoAPI) {}
    rpc SendRangeBoletoAVBToBradesco (RequestSendRangeBoletoToBradesco) returns (ServiceResponseBoolean) {}

    // Porte de wfmListaEmissaoNotaFiscal.aspx (reimplementado em TypeORM, nao chama as SPs legadas
    // psgaNotaFiscal_ListaEmissao / ObterHonorariosPC / ListaEmissaoManual / psgaNotasFiscais_GeraArquivo).
    rpc listEmissaoNotaFiscal (ListCriteriaRequestEmissaoNotaFiscal) returns (ServiceResponseListEmissaoNotaFiscal) {}
    rpc obterHonorariosPrestContaNotaFiscal (IdRequest) returns (ServiceResponseHonorariosPrestContaNotaFiscal) {}
    rpc gerarDetalheNotaFiscal (GerarDetalheNotaFiscalRequest) returns (ServiceResponseDetalheNotaFiscal) {}
    rpc listClienteEmissaoManualNotaFiscal (ListCriteriaRequestClienteEmissaoManualNotaFiscal) returns (ServiceResponseListClienteEmissaoManualNotaFiscal) {}
    rpc calcularImpostosNotaFiscal (CalcularImpostosNotaFiscalRequest) returns (ServiceResponseImpostosNotaFiscal) {}
    // Emissao da nota fiscal (gravacao transacional: nota, itens, boleto/pagamento; registro do boleto no Bradesco apos o commit).
    rpc emitirNotaFiscal (EmitirNotaFiscalRequest) returns (ServiceResponseEmitirNotaFiscal) {}
    rpc emitirNotaFiscalManual (EmitirNotaFiscalManualRequest) returns (ServiceResponseEmitirNotaFiscal) {}
    // Aba "Ativo/Preventivo": NF mensal dos servicos de tecoClientesAtivosPreventivos (mesma gravacao da emissao manual).
    rpc listNotaFiscalAtivoPreventivo (ListCriteriaRequestNotaFiscalAtivoPreventivo) returns (ServiceResponseListNotaFiscalAtivoPreventivo) {}
    rpc emitirNotaFiscalAtivoPreventivo (EmitirNotaFiscalAtivoPreventivoRequest) returns (ServiceResponseEmitirNotaFiscal) {}
    // Previa (sem gravar) de impostos e vencimento do boleto da NF Ativo/Preventivo, pelas mesmas regras da emissao.
    rpc previaNotaFiscalAtivoPreventivo (PreviaNotaFiscalAtivoPreventivoRequest) returns (ServiceResponsePreviaNotaFiscalAtivoPreventivo) {}
    // E-mail da NF (popup wfmPopNotaFiscal): preparar (contatos, assunto, mensagem, valores), enviar, alterar vencimento e baixar anexos.
    rpc prepararEmailNotaFiscal (PrepararEmailNotaFiscalRequest) returns (ServiceResponsePrepararEmailNotaFiscal) {}
    rpc enviarEmailNotaFiscal (EnviarEmailNotaFiscalRequest) returns (ServiceResponseEnviarEmailNotaFiscal) {}
    rpc alterarVencimentoNotaFiscal (AlterarVencimentoNotaFiscalRequest) returns (ServiceResponseAlterarVencimentoNotaFiscal) {}
    rpc baixarArquivoNotaFiscal (BaixarArquivoNotaFiscalRequest) returns (ServiceResponseArquivoNotaFiscal) {}
    // Lista de notas emitidas (wfmListaNotaFiscal): clientes com notas (paginado), notas de um cliente e exclusao.
    rpc listClienteNotasFiscais (ListCriteriaRequestClienteNotasFiscais) returns (ServiceResponseListClienteNotasFiscais) {}
    rpc listNotasFiscaisCliente (ListCriteriaRequestNotasFiscaisCliente) returns (ServiceResponseListNotasFiscaisCliente) {}
    rpc excluirNotasFiscais (ExcluirNotasFiscaisRequest) returns (ServiceResponseExcluirNotasFiscais) {}
    // Extrato NF (wfmListaExtratoNF / wfmCadExtratoNF) e Escrituracao NF (wfmListaEscrituracaoNF).
    rpc listExtratoNf (ListCriteriaRequestExtratoNf) returns (ServiceResponseListExtratoNf) {}
    rpc findExtratoNf (IdRequest) returns (ServiceResponseExtratoNf) {}
    rpc salvarExtratoNf (SalvarExtratoNfRequest) returns (ServiceResponseAcaoExtratoNf) {}
    rpc adicionarDepositosExtratoNf (AdicionarDepositosExtratoNfRequest) returns (ServiceResponseAcaoExtratoNf) {}
    rpc excluirExtratoNf (ExcluirExtratoNfRequest) returns (ServiceResponseAcaoExtratoNf) {}
    rpc identificarNotaFiscalExtratoNf (IdentificarNotaFiscalExtratoNfRequest) returns (ServiceResponseIdentificarNotaFiscalExtratoNf) {}
    rpc opcoesExtratoNf (OpcoesExtratoNfRequest) returns (ServiceResponseOpcoesExtratoNf) {}
    rpc listEscrituracaoNf (ListCriteriaRequestEscrituracaoNf) returns (ServiceResponseListEscrituracaoNf) {}
    rpc escriturarNf (EscriturarNfRequest) returns (ServiceResponseEscriturarNf) {}
    // Importacao de depositos no cadastro do Extrato NF (CNAB de retorno e API de boletos pagos do Bradesco) e relatorio (PDF).
    rpc importarCnabExtratoNf (ImportarCnabExtratoNfRequest) returns (ServiceResponseImportacaoExtratoNf) {}
    rpc importarApiBradescoExtratoNf (ImportarApiBradescoExtratoNfRequest) returns (ServiceResponseImportacaoExtratoNf) {}
    rpc relatorioExtratoNf (IdRequest) returns (ServiceResponseArquivoNotaFiscal) {}
    // Dados cadastrais do cliente (dialog aberto a partir das telas de Extrato NF e Escrituracao NF).
    rpc obterClienteNf (IdRequest) returns (ServiceResponseClienteNf) {}
    // Controle de contas a receber (dashboard): uma linha por nota fiscal (titulo a receber) e o resumo (cards, aging, por origem).
    rpc listTitulosReceber (ListCriteriaRequestTitulosReceber) returns (ServiceResponseListTitulosReceber) {}
    rpc resumoTitulosReceber (ListCriteriaRequestTitulosReceber) returns (ServiceResponseResumoTitulosReceber) {}
    // Indicadores por cliente (ranking de inadimplencia e pontualidade) e previsao/evolucao (calendario, serie mensal, situacao das notas).
    rpc listClientesReceber (ListCriteriaRequestTitulosReceber) returns (ServiceResponseListClientesReceber) {}
    rpc previsaoTitulosReceber (ListCriteriaRequestTitulosReceber) returns (ServiceResponsePrevisaoTitulosReceber) {}

    // Porte de wfmListaControleNotasFiscais.aspx (Controle Notas Fiscais: em aberto / quitadas)
    rpc listControleNotasFiscais (ListCriteriaRequestControleNotasFiscais) returns (ServiceResponseListControleNotasFiscais) {}
    rpc registrarRetornoNotaVencida (RegistrarRetornoNotaVencidaRequest) returns (ServiceResponseBoolean) {}
    rpc inserirItemExtratoNf (InserirItemExtratoNfRequest) returns (ServiceResponseAcaoExtratoNf) {}

    rpc listClienteAtivoPreventivo (ListCriteriaRequestClienteAtivoPreventivo) returns (ServiceResponseListClienteAtivoPreventivo) {}
    rpc findOneClienteAtivoPreventivo (IdRequest) returns (ServiceResponseClienteAtivoPreventivo) {}
    rpc createClienteAtivoPreventivo (ClienteAtivoPreventivoPData) returns (ServiceResponseClienteAtivoPreventivo) {}
    rpc updateClienteAtivoPreventivo (ClienteAtivoPreventivoPUpdateRequest) returns (ServiceResponseClienteAtivoPreventivo) {}
    rpc removeClienteAtivoPreventivo (IdRequest) returns (ServiceResponseClienteAtivoPreventivo) {}
}

message IdRequest{
    int32 id = 1;
}

message ServiceResponseBoolean {
    int32 status = 1;
    string message = 2;
    bool data = 3;
    string error = 4;
}


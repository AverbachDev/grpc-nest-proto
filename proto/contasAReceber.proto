    string nomeArquivo = 1;
    string conteudoBase64 = 2;
    int32 idUsuaOper = 3;
}

// Consulta a API de boletos pagos do Bradesco (agencias 18, 19 e 26) na data do extrato (AAAA-MM-DD).
message ImportarApiBradescoExtratoNfRequest {

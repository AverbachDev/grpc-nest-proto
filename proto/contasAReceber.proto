// EXTRATO NF (wfmListaExtratoNF.aspx / wfmCadExtratoNF.aspx) E ESCRITURACAO NF (wfmListaEscrituracaoNF.aspx)

// Filtros opcionais; datas YYYY-MM-DD inclusivas; deExtrato = contem (sem diferenciar maiusculas). items = -1 traz tudo.
message ListCriteriaRequestExtratoNf {
    string dtExtratoIni = 1;
    string dtExtratoFim = 2;
    string deExtrato = 3;
    int32 items = 4;
    int32 page = 5;
}

// nuValor = soma dos itens do extrato.
message ExtratoNfListaData {
    int32 idExtratonf = 1;
    string dtExtrato = 2;
    string deExtrato = 3;
    int32 idStatusextrato = 4;
    string deStatusextrato = 5;
    double nuValor = 6;
}

message ListResultExtratoNf {
    repeated ExtratoNfListaData result = 1;
    int32 total = 2;
}

message ServiceResponseListExtratoNf {
    int32 status = 1;
    string message = 2;
    ListResultExtratoNf data = 3;
    string error = 4;
}

// Item do extrato. Na gravacao so idNotafiscal, nuValor, idTipodeposito e idAgencia sao usados (idItemextratonf = 0 para item novo).
message ItemExtratoNfData {
    int32 idItemextratonf = 1;
    int32 idNotafiscal = 2;
    string deNotafiscal = 3;
    string nmCliente = 4;
    double nuValor = 5;
    int32 idTipodeposito = 6;
    int32 idAgencia = 7;
    int32 idStatusdeposito = 8; // 0 = ainda nao liberado para escrituracao; 1 = aguardando escrituracao; 2 = escriturado
    bool possivelDuplicidade = 9; // so na importacao: a nota ja tem pagamento registrado com este mesmo valor
    int32 idCliente = 10; // cliente da nota (para abrir os dados do cliente); ignorado na gravacao
}

// Status do extrato: 1 = Em elaboracao, 2 = Em conferencia (liberado), >2 = itens ja validados/escriturados.
message ExtratoNfData {
    int32 idExtratonf = 1;
    string dtExtrato = 2;
    int32 idStatusextrato = 3;
    string deStatusextrato = 4;
    repeated ItemExtratoNfData itens = 5;
}

message ServiceResponseExtratoNf {
    int32 status = 1;
    string message = 2;
    repeated ExtratoNfData data = 3;
    string error = 4;
}

// idExtratonf = 0 cria um extrato novo. liberar = true salva e libera para conferencia/escrituracao (status 2).
message SalvarExtratoNfRequest {
    int32 idExtratonf = 1;
    string dtExtrato = 2;
    repeated ItemExtratoNfData itens = 3;
    bool liberar = 4;
    int32 idUsuaOper = 5;
}

// Inclui depositos NOVOS num extrato ja liberado (status 2). Somente administrador.
message AdicionarDepositosExtratoNfRequest {
    int32 idExtratonf = 1;
    repeated ItemExtratoNfData itens = 2;
    int32 idUsuaOper = 3;
    bool administrador = 4;
}

message ExcluirExtratoNfRequest {
    int32 idExtratonf = 1;
    int32 idUsuaOper = 2;
}

// Resultado comum de salvar, adicionar depositos e excluir (na exclusao qtdItens = itens removidos).
message AcaoExtratoNfData {
    int32 idExtratonf = 1;
    int32 idStatusextrato = 2;
    int32 qtdItens = 3;
}

message ServiceResponseAcaoExtratoNf {
    int32 status = 1;
    string message = 2;
    repeated AcaoExtratoNfData data = 3;
    string error = 4;
}

// Identifica a nota pelo numero (deNotafiscal) ou pelo id interno (idNotafiscal, quando deNotafiscal vazio).
// O mesmo numero pode existir em mais de uma nota (722 numeros repetidos em producao): devolve TODAS as notas
// encontradas (ate 20, da mais recente para a mais antiga) para o usuario escolher; o legado pegava a primeira em silencio.

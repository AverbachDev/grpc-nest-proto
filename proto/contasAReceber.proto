// EMISSAO DE NOTA FISCAL (wfmListaEmissaoNotaFiscal.aspx)

// cdPeriodicidade e obrigatorio: "0" diaria, "1" semanal, "2" quinzenal, "3" mensal.
// Demais filtros sao opcionais (string vazia = sem filtro): cdLocalNf "RJ"/"SP",
// tpRepasse "LÍQUIDO"/"BRUTO"/"RD"/"RD CONCILIAÇÃO", nmCliente = contem, case-insensitive.
message ListCriteriaRequestEmissaoNotaFiscal {
    string cdPeriodicidade = 1;
    string cdLocalNf = 2;
    string tpRepasse = 3;
    string nmCliente = 4;
}

// Uma linha = uma prestacao de contas (PC) + tipo de repasse, ainda sem tecoItemNotaFiscal.
// dtPrestconta/dtRepasse vem como "dd/MM/yyyy" (igual ao legado) para nao sofrer deslocamento de timezone.
message EmissaoNotaFiscalData {
    string nmCliente = 1;
    double nuHonorCliente = 2;
    double nuHonorDevedor = 3;
    string cdPrestContaVl = 4;
    string tpRepasse = 5;
    string cdLocalNf = 6;
    string cdPeriodicidade = 7;
    string tpPagamento = 8;
    string deInstrucao = 9;
    string cdNfHonorDevedor = 10;

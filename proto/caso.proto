// 1:1 CasoPrevPagtoModel (infrastructure/database/typeorm/models/
// caso-prev-pagto.entity-orm.ts).
message ListCriteriaRequestCasoPrevPagto {
    int32 idCaso = 1;
    int32 idUsuaCobrador = 2;
    string nmDevedor = 3;
    string cdCnpjCpf = 4;
    string dtVencInicio = 5;
    string dtVencFim = 6;
    string dtAgendContInicio = 7;
    string dtAgendContFim = 8;
    double nuValorInicio = 9;
    double nuValorFim = 10;
    // Forma do acordo (wfmPrevPagto.aspx.vb ddlFormaPagto: filtro por
    // "comeca com" sobre o TEXTO descritivo que a propria view retorna em
    // cd_acordo - ex.: "Integral"/"Parcelado"/"Por Títulos"/"Por Conta" -,
    // nao os codigos curtos '0'-'3' usados em outras entidades.
    string cdAcordo = 11;
    // Status da cobranca (filtro exato) - a aba "Aguardando Cartão de
    // Crédito" do legado usa id_statusCobranca = 22.
    int32 idStatusCobranca = 12;
    // Idem, mas para excluir (<>) - a aba "Previsão de Pagamento" do legado
    // usa id_statusCobranca <> 22 (wfmPrevPagto.aspx.vb:99-103).

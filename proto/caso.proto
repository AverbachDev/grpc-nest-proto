}

message SalvarSituacaoCobrancaRequest {
    int32 idCaso = 1;
    int32 idMotivoInadimplencia = 2;
    int32 idUsuaOper = 3;
}

// Porte dos avisos computados do cabecalho, incluindo a categoria
// tp_mensagem=1 (mensagem principal, sempre visivel) de
// psgaCaso_ObterMensagemInicio (definicao obtida do usuario - as outras 3
// categorias dessa SP, tp_mensagem 2/3/4, ficaram de fora desta rodada).
message AvisoCasoData {
    string texto = 1;
    string cor = 2;
    // Quando true, `texto` contem HTML literal (font/br/strong/table do
    // legado) e deve ser renderizado como tal, nao como texto puro.
    optional bool htmlContent = 3;
    // Quando true, o aviso e fiel a MensagemInicio (wfmCadAcordo.aspx.vb:
    // 1403-1532, Me.ExibirMensagem(MensagemInicio)) - exibido como popup
    // modal na abertura do caso, nao como label fixo no cabecalho. Quando
    // false/ausente, o aviso e fiel a lbl_aviso1/lbl_aviso2 - label fixo.
    optional bool popup = 4;
    // Quando true, este e o aviso do tp_mensagem=4 (COBRANCA BRANDA) da SP
    // psgaCaso_ObterMensagemInicio - o frontend usa a presenca deste aviso
    // para sobrescrever a exibicao do checkbox "Cobranca Branda" (chkcd_branda,
    // wfmCadAcordo.aspx.vb:1421-1440), fiel ao Page_Load do legado, que
    // forca o Checked=True mesmo quando caso.cd_branda=0 no banco.
    optional bool cobrancaBranda = 5;
}

message ServiceResponseAvisoCaso {
    int32 status = 1;
    string message = 2;
    repeated AvisoCasoData data = 3;
    string error = 4;
}


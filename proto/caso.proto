// da primeira parcela nao paga > 3 dias.
message RegistrarQuebraAcordoRequest {
    int32 idCaso = 1;
    int32 idUsuaOper = 2;
}

// Complemento do popup "Informacoes do Caso" (wfmPopInformacoesCaso.aspx do
// legado): Observacoes Contratuais (contrato.de_obs) + grid Historico de

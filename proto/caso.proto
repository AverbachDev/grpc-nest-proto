// Porte da cascata de parametrizacao de acordo do legado (wfmCadAcordo.aspx.vb,
// ObterDados): campos do contrato do primeiro titulo do caso (mesmo padrao do
// VB EntCliente.tecoContratos(0)) + idGrupo do cliente (usado nas excecoes
// hardcoded de quantidade de parcela por grupo).
message ParametrizacaoAcordoData {
    double nuMaxParcelas = 1;
    bool cdDesabilitaAcordoIntegral = 2;
    bool cdDesabilitaAcordoParcelado = 3;
    bool cdDesabilitaAcordoPorTitulos = 4;
    bool cdDesabilitaAcordoPorConta = 5;
    bool cdDesabPorTitulosSupMaxParcelas = 6;
    bool cdCartaoCredito = 7;
    bool cdPagtoCliente = 8;
    bool cdCalculoAcordoTabelaPrice = 9;
    int32 idGrupo = 10;
    int32 nuPrazoPermanencia = 11;
    string dePermanencia = 12;
    int32 cdTipoContrato = 13;
    int32 cdValorPreventivo = 14;
    // Juros Vincendos (wfmCadAcordo.aspx.vb:1339-1391): "0"/vazio sem juros
    // vincendos, "1" percentual igual ao maior juros do calculo, "2"
    // percentual fixo definido em contrato (perVincendos).
    string cdVincendos = 15;
    double perVincendos = 16;
    bool cdVincendosParcelasIguais = 17;
}

message ServiceResponseParametrizacaoAcordo {
    int32 status = 1;
    string message = 2;
    repeated ParametrizacaoAcordoData data = 3;
    string error = 4;
}


// Porte dos metodos de calculo de juros/multa/honorarios (titulo-calculo.service.ts)
// aplicados a um titulo especifico, usando os parametros (tp_juros, cd_multa,
// cd_nu_multa) do contrato do titulo.
message CalcularTituloRequest {
    int32 id = 1;
    string dtCalculo = 2;
    double perJuros = 3;
    double perMulta = 4;
    double perHonorDevedor = 5;
    // Usado so para a excecao Saint-Gobain Weber5 (juros=0, editavel apenas
    // para Admin ou um grupo pequeno de usuarios especificos,
    // wfmCadAcordo.aspx.vb:753-812) - precisa saber quem esta calculando.
    // "optional" porque outras chamadas que reusam esta mensagem (ex.:
    // validarCalculoProativoTitulo) nao tem esse dado.
    optional int32 idUsuario = 6;
}

// Porte de grdCalculo_ItemDataBound (wfmCadAcordo.aspx.vb): determina se um

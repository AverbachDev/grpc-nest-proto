syntax = "proto3";

package caso;


service CasoService {

    rpc listCaso (ListCriteriaRequestCaso) returns (ServiceResponseListCaso) {}
    rpc findOneCaso (IdRequest) returns (ServiceResponseCaso) {}
    rpc createCaso (CasoData) returns (ServiceResponseCaso) {}
    rpc updateCaso (CasoUpdateRequest) returns (ServiceResponseCaso) {}
    rpc saveCaso (CasoUpdateRequest) returns (ServiceResponseCaso) {}
    rpc saveCasoAcordo (CasoUpdateRequest) returns (ServiceResponseCaso) {}
    rpc removeCaso (IdRequest) returns (ServiceResponseCaso) {}
    rpc listCasoWithExternalFields (ListCriteriaRequestCasoWithExternalFields) returns (ServiceResponseListCasoWithExternalFields) {}
    rpc listCasosRD (ListCriteriaRequestCaso) returns (ServiceResponseListCasoWithExternalFields) {}
    rpc getTotalCasosAgendadosByUser (IdRequest) returns (ServiceResponseInteger) {}
    rpc applyNewCobrador (ApplyNewCobradorRequest) returns (ServiceResponseCaso) {}
    rpc cancelarAcordo (CancelarAcordoRequest) returns (ServiceResponseCaso) {}
    rpc registrarQuebraAcordo (RegistrarQuebraAcordoRequest) returns (ServiceResponseCaso) {}
    rpc obterInformacoesCaso (IdRequest) returns (ServiceResponseInformacoesCaso) {}
    rpc avaliarCaso (AvaliarCasoRequest) returns (ServiceResponseCaso) {}
    rpc solicitarProrrogacao (SolicitarProrrogacaoRequest) returns (ServiceResponseCaso) {}
    rpc salvarSituacaoCobranca (SalvarSituacaoCobrancaRequest) returns (ServiceResponseCaso) {}
    rpc obterAvisosCaso (IdRequest) returns (ServiceResponseAvisoCaso) {}
    rpc validarDevolucaoCaso (IdRequest) returns (ServiceResponseValidarDevolucao) {}
    rpc listPossibilidadeExitoCaso (EmptyRequest) returns (ServiceResponseListPossibilidadeExitoCaso) {}
    rpc listAreaTrabalho (ListCriteriaRequestAreaDeTrabalho) returns (ServiceResponseListAreaDeTrabalho) {}
    rpc contarCasosTrabalhados (ContadorAreaTrabalhoRequest) returns (ServiceResponseContadorAreaTrabalho) {}
    rpc contarCasosEmPesquisa (ContadorAreaTrabalhoRequest) returns (ServiceResponseContadorAreaTrabalho) {}
    rpc obterParametrizacaoAcordo (IdRequest) returns (ServiceResponseParametrizacaoAcordo) {}
    rpc obterUsuarioCriadorCaso (IdRequest) returns (ServiceResponseUsuarioCriadorCaso) {}
    rpc listCasoPrevPagto (ListCriteriaRequestCasoPrevPagto) returns (ServiceResponseListCasoPrevPagto) {}

    rpc listTitulo (ListCriteriaRequestTitulo) returns (ServiceResponseListTitulo) {}
    rpc findOneTitulo (IdRequest) returns (ServiceResponseTitulo) {}
    rpc createTitulo (TituloData) returns (ServiceResponseTitulo) {}
    rpc updateTitulo (TituloUpdateRequest) returns (ServiceResponseTitulo) {}
    rpc saveTitulo (TituloUpdateRequest) returns (ServiceResponseTitulo) {}
    rpc removeTitulo (IdRequest) returns (ServiceResponseTitulo) {}
    rpc findBalanceTitulosCaso (IdRequest) returns (ServiceResponseTitulo) {}
    rpc obterCalculoPadraoTitulo (IdRequest) returns (ServiceResponseCalculoPadraoTitulo) {}
    rpc calcularTitulo (CalcularTituloRequest) returns (ServiceResponseTitulo) {}
    rpc obterStatusPagamentoTitulo (IdRequest) returns (ServiceResponseStatusPagamentoTitulo) {}
    rpc obterSolicLuxotticaTitulo (IdRequest) returns (ServiceResponseRepositorioLuxottica) {}
    rpc validarCalculoProativoTitulo (CalcularTituloRequest) returns (ServiceResponseValidarCalculoProativoTitulo) {}

    rpc listAcordo (ListCriteriaRequestAcordo) returns (ServiceResponseListAcordo) {}
    rpc findOneAcordo (IdRequest) returns (ServiceResponseAcordo) {}
    rpc createAcordo (AcordoData) returns (ServiceResponseAcordo) {}
    rpc updateAcordo (AcordoUpdateRequest) returns (ServiceResponseAcordo) {}
    rpc saveAcordo (AcordoUpdateRequest) returns (ServiceResponseAcordo) {}
    rpc removeAcordo (IdRequest) returns (ServiceResponseAcordo) {}
    rpc setAcordoRd (AcordoData) returns (ServiceResponseAcordo) {}

    rpc listParcela (ListCriteriaRequestParcela) returns (ServiceResponseListParcela) {}
    rpc findOneParcela (IdRequest) returns (ServiceResponseParcela) {}
    rpc createParcela (ParcelaData) returns (ServiceResponseParcela) {}
    rpc updateParcela (ParcelaUpdateRequest) returns (ServiceResponseParcela) {}
    rpc saveParcela (ParcelaUpdateRequest) returns (ServiceResponseParcela) {}
    rpc removeParcela (IdRequest) returns (ServiceResponseParcela) {}
    rpc deleteUnPaidParcela (IdRequest) returns (ServiceResponseBoolean) {}
    rpc obterPagamentoParcela (IdRequest) returns (ServiceResponsePagamentoParcela) {}


    rpc listCasoCarta (ListCriteriaRequestCasoCarta) returns (ServiceResponseListCasoCarta) {}
    rpc findOneCasoCarta (IdRequest) returns (ServiceResponseCasoCarta) {}
    rpc createCasoCarta (CasoCartaData) returns (ServiceResponseCasoCarta) {}
    rpc updateCasoCarta (CasoCartaUpdateRequest) returns (ServiceResponseCasoCarta) {}
    rpc saveCasoCarta (CasoCartaUpdateRequest) returns (ServiceResponseCasoCarta) {}
